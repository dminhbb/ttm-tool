<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTM Monitor — Dashboard theo dõi Epic</title>
<style>
:root {
  --canvas:     #eef1f5;
  --surface:    #ffffff;
  --surface-el: #f0f4fa;
  --brand:      #2563eb;
  --brand-sub:  #dbeafe;
  --brand-bdr:  #93c5fd;
  --text-1:     #1e2535;
  --text-2:     #4b5568;
  --text-m:     #7a8499;
  --bdr:        #c8d3e0;
  --bdr-s:      #94a3b8;
  --nav:        #1e2d4a;
  --nav-t:      #cbd5e1;
  --success:    #15803d;
  --late:       #ea580c;
  --early:      #d97706;
  --fail:       #dc2626;
  --anomaly:    #7c3aed;
  --e2e:        #0e7490;
  --sh: 0 1px 4px rgba(0,0,0,.08);
  --sh-el: 0 4px 14px rgba(37,99,235,.12);
  --sz: 11.5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--sz)}
body{background:var(--canvas);color:var(--text-1);font-family:"Segoe UI",Arial,system-ui,sans-serif;font-size:var(--sz);line-height:1.55;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bdr-s);border-radius:3px}

.shell{display:flex;min-height:100vh}
.sidebar{width:72px;background:var(--nav);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.main{margin-left:72px;flex:1;display:flex;flex-direction:column;min-width:0}

.sb-logo{height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-mark{width:32px;height:32px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-btn{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:40px;border-radius:8px;margin:2px auto;color:var(--nav-t);cursor:pointer;border:none;background:none;transition:background 120ms}
.sb-btn:hover{background:rgba(255,255,255,.08)}
.sb-btn.active{background:var(--nav-act,#2563eb);color:#fff}
.sb-tip{display:none;position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#1e293b;color:#f8fafc;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;z-index:200}
.sb-btn:hover .sb-tip{display:block}
.sb-div{height:1px;background:rgba(255,255,255,.08);margin:6px 12px}

.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:13px;font-weight:700}
.topbar .sub{font-size:10.5px;color:var(--text-m);margin-left:4px}
.topbar .spacer{flex:1}
.breadcrumb{display:flex;align-items:center;gap:6px;padding:14px 20px 0}
.bc-item{font-size:11px;font-weight:600;color:var(--text-m);padding:3px 8px;border-radius:5px}
.bc-item.active{color:var(--brand);background:var(--brand-sub)}
.content{flex:1;padding:14px 20px 32px}

/* ── Bộ lọc ── */
.filter-bar{background:var(--surface);border:1px solid var(--bdr);border-radius:12px;padding:12px 16px;box-shadow:var(--sh);margin-bottom:16px}
.filter-grid{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filter-field{display:flex;flex-direction:column;gap:4px;min-width:180px}
.filter-field label{font-size:10px;font-weight:700;color:var(--text-m);text-transform:uppercase;letter-spacing:.4px}
.filter-field select{font-size:var(--sz);padding:7px 10px;border:1px solid var(--bdr);border-radius:7px;background:var(--surface);color:var(--text-1);outline:none;cursor:pointer;min-width:180px}
.filter-field select:focus{border-color:var(--brand-bdr);box-shadow:0 0 0 2px var(--brand-sub)}

/* ── Thanh Bar ── */
.kpi-strip{display:flex;gap:10px;margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.kpi-card{background:var(--surface);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;box-shadow:var(--sh);min-width:120px;flex:1 1 0;text-align:center}
.kpi-lbl{font-size:12.5px;font-weight:800;color:var(--text-2);line-height:1.2;margin-bottom:8px;min-height:30px;display:flex;align-items:center;justify-content:center}
.kpi-val{font-size:22px;font-weight:800;line-height:1;display:flex;align-items:baseline;justify-content:center;gap:5px}
.kpi-pct{font-size:12.5px;font-weight:700}
.kpi-card.total   .kpi-val{color:var(--text-1)} .kpi-card.total .kpi-lbl{color:var(--text-1)}
.kpi-card.ok      .kpi-val{color:var(--success)} .kpi-card.ok .kpi-pct{color:var(--success)}
.kpi-card.fail    .kpi-val{color:var(--fail)}    .kpi-card.fail .kpi-pct{color:var(--fail)}
.kpi-card.late    .kpi-val{color:var(--late)}    .kpi-card.late .kpi-pct{color:var(--late)}
.kpi-card.early   .kpi-val{color:var(--early)}   .kpi-card.early .kpi-pct{color:var(--early)}
.kpi-card.anomaly .kpi-val{color:var(--anomaly)} .kpi-card.anomaly .kpi-pct{color:var(--anomaly)}
.kpi-card.e2e .kpi-val{color:var(--e2e)} .kpi-card.e2e .kpi-pct{color:var(--e2e)}

/* ── Section ── */
.layer-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--bdr)}
.layer-hdr h2{font-size:13px;font-weight:800;color:var(--text-1)}
.layer-badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--brand-sub);color:var(--brand);border:1px solid var(--brand-bdr)}
.sub-sec-hdr{display:flex;align-items:center;gap:8px;margin:18px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.sub-sec-hdr h3{font-size:12px;font-weight:700;color:var(--text-2)}
.sub-sec-badge{display:inline-flex;height:18px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:700;align-items:center}

/* ── Hàng donut ── */
.donut-row{background:var(--surface);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:14px}
.donut-row-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.donut-row-hdr h3{font-size:11.5px;font-weight:800;color:var(--text-1)}
.donut-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1400px){.donut-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.donut-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.donut-grid{grid-template-columns:1fr}}
.donut-card{border:1px solid var(--bdr);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-el)}
.donut-card .d-title{font-size:10px;font-weight:700;color:var(--text-2);text-align:center;line-height:1.3;min-height:26px;display:flex;align-items:center}
.donut-wrap{position:relative;width:105px;height:105px;flex-shrink:0}
.donut-wrap svg{width:100%;height:100%}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.donut-center .dc-num{font-size:16px;font-weight:800;line-height:1;color:var(--text-1)}
.donut-center .dc-sub{font-size:8px;color:var(--text-m)}
.legend{width:100%;display:flex;flex-direction:column;gap:3px}
.lg-row{display:flex;align-items:center;gap:5px}
.lg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lg-name{flex:1;font-size:9px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-val{font-size:9px;font-weight:700;color:var(--text-1)}
.lg-pct{font-size:8.5px;color:var(--text-m);width:30px;text-align:right}
</style>
</head>
<body>
<div class="shell">

<nav class="sidebar" aria-label="Navigation">
  <div class="sb-logo"><div class="sb-mark">E</div></div>
  <div class="sb-nav">
    <button class="sb-btn active" aria-label="Dashboard Epic">
      <svg width="19" height="19" fill="currentColor" viewBox="0 0 256 256"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM40,56H216v40H40ZM40,200V112H96v88Zm72,0V112h104v88Z"/></svg>
      <span class="sb-tip">Dashboard Epic</span>
    </button>
    <div class="sb-div"></div>
    <button class="sb-btn" aria-label="Nguồn dữ liệu">
      <svg width="19" height="19" fill="currentColor" viewBox="0 0 256 256"><path d="M128,24C74.17,24,32,48.6,32,80v96c0,31.4,42.17,56,96,56s96-24.6,96-56V80C224,48.6,181.83,24,128,24Z"/></svg>
      <span class="sb-tip">Nguồn dữ liệu</span>
    </button>
  </div>
  <div style="padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:center">
    <div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:var(--nav-t);font-size:12px;font-weight:700">L</div>
  </div>
</nav>

<div class="main">
  <header class="topbar">
    <h1>Dashboard theo dõi Epic</h1>
    <span class="sub">— Theo dõi tiến độ Epic · TTM E2E &amp; CNTT</span>
    <div class="spacer"></div>

  </header>

  <div class="breadcrumb"><span class="bc-item active">Dashboard Epic</span></div>

  <div class="content">

    <!-- ════════ BỘ LỌC ════════ -->
    <div class="filter-bar">
      <div class="filter-grid">
        <div class="filter-field">
          <label>Thời gian</label>
          <select id="f-time" onchange="applyFilter()">
            <option value="ky2">Kỳ 2</option>
            <option value="2026-07">Tháng 7 / 2026</option>
            <option value="2026-08">Tháng 8 / 2026</option>
            <option value="2026-09">Tháng 9 / 2026</option>
          </select>
        </div>
        <div class="filter-field">
          <label>Domain</label>
          <select id="f-domain" onchange="applyFilter()">
            <option value="">All</option>
            <option value="HTKD">HTKD</option>
            <option value="Tín dụng và Rủi ro">Tín dụng và Rủi ro</option>
            <option value="Sàn quỹ và TTTM">Sàn quỹ và TTTM</option>
            <option value="Dịch vụ số">Dịch vụ số</option>
          </select>
        </div>
        <div class="filter-field">
          <label>PM / SM</label>
          <select id="f-pmsm" onchange="applyFilter()">
            <option value="">All</option>
            <option value="Nguyễn Thị Oanh">Nguyễn Thị Oanh</option>
            <option value="Trần Khánh Linh">Trần Khánh Linh</option>
            <option value="Nguyễn Văn Hùng">Nguyễn Văn Hùng</option>
            <option value="Nguyễn Đức Minh">Nguyễn Đức Minh</option>

          <select id="f-project" onchange="applyFilter()">
            <option value="">All Dự án</option>

          </select>

    <div id="main-content"></div>

  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   DATA MODEL (dữ liệu giả minh họa)
     sendUnit : đơn vị gửi YC      (tiêu chí 1)
     domain   : domain             (tiêu chí 2)
     phanLoai : phân loại Epic     (tiêu chí 3)
     project  : dự án              (tiêu chí 4)
     pmsm     : PM/SM              (tiêu chí 5)
     released : đã/ chưa release
     ttmCntt  : pass|fail|null     (chỉ áp dụng khi đã released)
     sched    : ok|late|early      (tiến độ, chỉ áp dụng khi chưa released)
══════════════════════════════════════════════════════════════════════ */

const SEND_UNITS = ['Ngân hàng số','Ban Sản phẩm','Khối Vận hành']
const DOMAINS    = ['HTKD','Tín dụng và Rủi ro','Sàn quỹ và TTTM','Dịch vụ số']
const PHANLOAI   = ['SP','Cải tiến/Tính năng L1-2','Cải tiến/Tính năng L3-4']
const PROJECTS   = ['SC','API','WM','CRMCN','SSM1','TTTM','CTQT']
const PMSMS      = ['Nguyễn Thị Oanh','Trần Khánh Linh','Nguyễn Văn Hùng','Nguyễn Đức Minh','Hà Công','Phạm Tuấn Hậu']

const r = arr => arr[Math.floor(Math.random()*arr.length)]
function genEpics() {
  const epics = []
  const schedPool = ['ok','ok','ok','ok','late','late','early']
  for (let i=0;i<150;i++){
    const released = Math.random() < 0.52
    const sched = schedPool[Math.floor(Math.random()*schedPool.length)]
    epics.push({
      key:`EPIC-${1000+i}`, name:`Epic ${i+1}`,
      sendUnit:r(SEND_UNITS), domain:r(DOMAINS), phanLoai:r(PHANLOAI),
      project:r(PROJECTS), pmsm:r(PMSMS),
      released,
      ttmCntt: released ? (Math.random()<0.72?'pass':'fail') : null,
      sched,
    })
  }
  return epics
}
let EPICS = genEpics()

/* ══ State ══ */
const state = { time:'ky2', project:'', domain:'', pmsm:'' }

/* ══ Filter logic ══ */
function applyFilter(){
  state.time    = document.getElementById('f-time').value
  state.domain  = document.getElementById('f-domain').value
  state.pmsm    = document.getElementById('f-pmsm').value
  state.project = document.getElementById('f-project').value

  let list = EPICS
  if (state.domain)  list = list.filter(e=>e.domain===state.domain)
  if (state.pmsm)    list = list.filter(e=>e.pmsm===state.pmsm)
  if (state.project) list = list.filter(e=>e.project===state.project)
  render(list)
}

/* ══ Helpers ══ */
const released = list => list.filter(e=>e.released)
const ipr = list => list.filter(e=>!e.released)

/* Công thức phân loại (theo yêu cầu):
   Tổng = Pass TTM + Fail TTM + Đúng tiến độ + Chậm tiến độ
   Pass/Fail TTM = đã released · Đúng/Chậm = chưa released
   Chưa released = Đúng + Chậm (early gộp vào Chậm để khớp công thức) */
function countStatus(list, key, items){
  // Trả về mảng {name, pass, fail, ok, late} theo từng giá trị của key
  return items.map(name=>{
    const es = list.filter(e=>e[key]===name)
    const rel = es.filter(e=>e.released)
    const npr = es.filter(e=>!e.released)
    const pass = rel.filter(e=>e.ttmCntt==='pass').length
    const fail = rel.filter(e=>e.ttmCntt==='fail').length
    const ok   = npr.filter(e=>e.sched==='ok').length
    const late = npr.filter(e=>e.sched!=='ok').length   // late + early = Chậm
    return { name, total: es.length, pass, fail, ok, late }
  })
}

/* ══ Thanh Bar 9 chỉ tiêu ══ */
function buildKpiStrip(list){
  const rel = released(list), npr = ipr(list), total = list.length
  const passCn =rel.filter(e=>e.ttmCntt==='pass').length
  const failCn =rel.filter(e=>e.ttmCntt==='fail').length
  const passE2e=passCn, failE2e=failCn   // giả lập E2E = CNTT
  const ok   =npr.filter(e=>e.sched==='ok').length
  const late =npr.filter(e=>e.sched==='late').length
  const early=npr.filter(e=>e.sched==='early').length
  const pct = (n,d)=> d>0 ? Math.round(n/d*100)+'%' : '—'
  const k=(cls,lbl,v,p)=>`<div class="kpi-card ${cls}"><div class="kpi-lbl">${lbl}</div><div class="kpi-val">${v}<span class="kpi-pct">${p}</span></div></div>`
  return `<div class="kpi-strip">
    ${k('total','Tổng số Epic', total, '100%')}
    ${k('e2e','Pass TTM E2E', passE2e, pct(passE2e,rel.length))}
    ${k('fail','Fail TTM E2E', failE2e, pct(failE2e,rel.length))}
    ${k('ok','Pass TTM CNTT', passCn, pct(passCn,rel.length))}
    ${k('fail','Fail TTM CNTT', failCn, pct(failCn,rel.length))}
    ${k('ok','Đúng tiến độ', ok, pct(ok,npr.length))}
    ${k('late','Cảnh báo muộn', late, pct(late,npr.length))}
    ${k('early','Cảnh báo sớm', early, pct(early,npr.length))}
    ${k('anomaly','Sai lệch dữ liệu', 0, '—')}
  </div>`
}

/* ══ Donut ══ */
function buildDonut(segs, total, size=105, thick=18){
  const r=(size-thick)/2, cx=size/2, cy=size/2
  if(!total) return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="${thick}"/></svg>`
  let paths='', off=-0.25*2*Math.PI*r
  segs.forEach(s=>{
    if(!s.value) return
    const dash=s.value/total*2*Math.PI*r, gap=2*Math.PI*r-dash, gp=Math.min(2,dash*0.06)
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${dash-gp} ${gap+gp}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`
    off+=dash
  })
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg) scaleY(-1)">${paths}</svg>`
}

/* 1 donut card: hiển thị tỷ lệ của 1 trạng thái, chia theo từng giá trị của tiêu chí.
   stateKey: 'total' | 'pass' | 'fail' | 'ok' | 'late' */
function donutCard(title, rows, stateKey, colorFn){
  const segs = rows.map((it,i)=>({ label:it.name, value:it[stateKey]||0, color:colorFn(it,i) }))
  const total = segs.reduce((s,x)=>s+x.value,0)
  const maxSeg = segs.reduce((a,b)=> b.value>a.value ? b : a, segs[0]||{value:0,label:''})
  const legend = segs.map(s=>{
    const p = total>0 ? Math.round(s.value/total*100) : 0
    return `<div class="lg-row"><div class="lg-dot" style="background:${s.color}"></div><span class="lg-name" title="${s.label}">${s.label}</span><span class="lg-val">${s.value}</span><span class="lg-pct">${p}%</span></div>`
  }).join('')
  return `<div class="donut-card">
    <div class="d-title">${title}</div>
    <div class="donut-wrap">${buildDonut(segs,total)}<div class="donut-center"><div class="dc-num">${total}</div><div class="dc-sub">Epic</div></div></div>
    <div class="legend">${legend}</div>
  </div>`
}

const DIM_COLORS=['#2563eb','#0891b2','#7c3aed','#059669','#d97706','#dc2626','#0e7490','#a16207','#b45309','#16a34a']
function dimColor(it, i){ return DIM_COLORS[i % DIM_COLORS.length] }

/* 1 hàng donut: 1 tiêu chí × 5 trạng thái */
function donutRow(key, keyLabel, rows){
  return `<div class="donut-row">
    <div class="donut-row-hdr">
      <h3>${keyLabel}</h3>
      <span class="sub-sec-badge" style="background:var(--brand-sub);color:var(--brand);border:1px solid var(--brand-bdr)">${rows.length} nhóm</span>
      <span style="margin-left:auto;font-size:10px;color:var(--text-m)">Tổng = Pass TTM + Fail TTM + Đúng tiến độ + Chậm tiến độ</span>
    </div>
    <div class="donut-grid">
      ${donutCard('% Tổng số Epic', rows, 'total', dimColor)}
      ${donutCard('% Epic Pass TTM', rows, 'pass', dimColor)}
      ${donutCard('% Epic Fail TTM', rows, 'fail', dimColor)}
      ${donutCard('% Epic Đúng tiến độ', rows, 'ok', dimColor)}
      ${donutCard('% Epic Chậm tiến độ', rows, 'late', dimColor)}
    </div>
  </div>`
}

/* ══ Main render ══ */
function render(list){
  const el=document.getElementById('main-content'); if(!el) return
  const data = list || EPICS

  const rows = {
    sendUnit: countStatus(data,'sendUnit',SEND_UNITS),
    domain:   countStatus(data,'domain',DOMAINS),
    phanLoai: countStatus(data,'phanLoai',PHANLOAI),
    pmsm:     countStatus(data,'pmsm',PMSMS),
    project:  countStatus(data,'project',PROJECTS),
  }

  // Ẩn hàng tương ứng với bộ lọc đang chọn
  const rowsHtml = []
  rowsHtml.push(donutRow('sendUnit','Theo Đơn vị gửi YC', rows.sendUnit))
  if (!state.domain)  rowsHtml.push(donutRow('domain','Theo Domain', rows.domain))
  rowsHtml.push(donutRow('phanLoai','Theo Phân loại Epic', rows.phanLoai))
  if (!state.pmsm)    rowsHtml.push(donutRow('pmsm','Theo PM/SM', rows.pmsm))
  if (!state.project) rowsHtml.push(donutRow('project','Theo Dự án', rows.project))

  el.innerHTML = `
    ${buildKpiStrip(data)}

    <div class="layer-hdr">
      <h2>Biểu đồ % Epic</h2>
      <span class="layer-badge">Phân theo 5 chiều thông tin</span>
      <span style="margin-left:auto;font-size:10px;color:var(--text-m)">Mỗi hàng: 5 biểu đồ donut (Tổng · Pass TTM · Fail TTM · Đúng tiến độ · Chậm tiến độ)</span>
    </div>

    ${rowsHtml.join('')}
  `
}

/* ══ Boot ══ */
render(EPICS)
</script>
</body>
</html>
