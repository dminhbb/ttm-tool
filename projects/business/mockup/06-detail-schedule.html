<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết dự án · Tiến độ — PMS Platform</title>
<link rel="stylesheet" href="assets/pms-tokens.css">
<link rel="stylesheet" href="assets/pms-ias.css">
<script src="assets/pms-icons.js"></script>
</head>
<body>
<div id="pms-page"></div>

<script src="assets/pms-util.js"></script>
<script src="assets/pms-ui.js"></script>
<script src="assets/mock-data.js"></script>
<script src="assets/pms-detail.js"></script>
<script src="assets/pms-shell.js"></script>
<script src="assets/gantt.js"></script>
<script>
const E = MBUtil.esc;
const D = PMSDetail;
const P = PRJ;
const SS = MBData.scheduleStats(P);

/* ───────────────────────── chỉ số tiến độ của dự án ────────────────────── */
function scheduleMetrics() {
  const last = P.schedule.milestones[P.schedule.milestones.length - 1];
  return '<div class="metric-grid">'
    + metric('Lệch ngày kết thúc dự án', MBUtil.signed(SS.finishSlip, ' ngày'),
        last ? 'baseline ' + MBUtil.fmtDate(last.baseDate) + ' → dự kiến ' + MBUtil.fmtDate(last.date) : '—',
        SS.finishSlip > 0 ? 't-error' : 't-success')
    + metric('Milestone trễ hạn', SS.milestoneLate + '/' + SS.milestoneTotal,
        SS.milestoneDone + ' milestone đã hoàn thành', SS.milestoneLate ? 't-error' : 't-success')
    + metric('Công việc đang trễ', SS.taskLate + '/' + SS.taskTotal,
        'trễ nhất ' + SS.maxSlip + ' ngày so với baseline', SS.taskLate ? 't-warning' : 't-success')
    + metric('Milestone kế tiếp', SS.next ? SS.next.name : '—',
        SS.next ? MBUtil.fmtDate(SS.next.date) + ' · còn ' + MBUtil.diffDays(MBUtil.iso(MBUtil.today()), SS.next.date) + ' ngày' : 'không còn milestone mở',
        '')
    + '</div>';
}
function metric(label, value, note, tone) {
  return '<div class="metric"><div class="metric-label">' + E(label) + '</div>'
    + '<div class="metric-value ' + (tone || '') + '">' + E(value) + '</div>'
    + '<div class="metric-note">' + E(note) + '</div></div>';
}

/* ──────────────────────────── bảng milestone ───────────────────────────── */
function milestoneTable() {
  const rows = P.schedule.milestones.map((m, i) => {
    const slip = MBUtil.diffDays(m.baseDate, m.date);
    const tone = m.status === 'done' ? 'success' : m.status === 'late' ? 'error' : 'blue';
    const label = m.status === 'done' ? 'Đã hoàn thành' : m.status === 'late' ? 'Trễ hạn' : 'Theo kế hoạch';
    return '<tr>'
      + '<td>' + String(i + 1).padStart(2, '0') + '</td>'
      + '<td class="td-link">' + E(m.id) + '</td>'
      + '<td class="td-truncate">' + E(m.name) + '</td>'
      + '<td>' + MBUtil.fmtDate(m.baseDate) + '</td>'
      + '<td>' + MBUtil.fmtDate(m.date) + '</td>'
      + '<td class="td-num ' + (slip > 0 ? 't-error' : 't-success') + '">' + MBUtil.signed(slip, '') + '</td>'
      + '<td>' + MBUtil.status(label, tone) + '</td></tr>';
  });
  return '<div class="table-wrap"><div class="table-inner" id="ms-wrap">'
    + '<table style="min-width:980px"><thead><tr>'
    + '<th style="width:52px">STT</th><th style="width:72px">Mã</th>'
    + '<th style="min-width:300px">Tên milestone</th>'
    + '<th style="min-width:130px">Baseline</th>'
    + '<th style="min-width:150px">Dự kiến / thực tế</th>'
    + '<th style="width:110px">Lệch (ngày)</th>'
    + '<th style="min-width:150px">Trạng thái</th>'
    + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div></div>';
}

/* ────────────────────────────────── render ─────────────────────────────── */
document.getElementById('pms-page').innerHTML =
  D.switcher('schedule')
  + D.summaryCard()
  + D.card('Chỉ số tiến độ', scheduleMetrics())
  + D.card('Sơ đồ Gantt — baseline so với thực tế',
    '<div id="gantt" class="gantt"></div>'
    + '<div class="legend mt-16">'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-neutral-400)"></span>Baseline đã chốt</span>'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-bg-success-solid)"></span>Thực tế đúng hạn</span>'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-bg-warning-solid)"></span>Trễ 1–10 ngày</span>'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-bg-error-solid)"></span>Trễ trên 10 ngày</span>'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-bg-brand)"></span>Chưa bắt đầu</span>'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-neutral-700)"></span>Nhóm công việc</span>'
    + '<span class="legend-item"><span class="legend-sw" style="background:var(--color-bg-error-solid);border-radius:50%"></span>Mũi tên đỏ = đường găng</span>'
    + '</div>',
    '<div class="row" style="gap:8px">'
    + '<button class="btn btn-outline btn-sm" id="g-expand"><span class="msym" style="font-size:16px">unfold_more</span>Mở hết</button>'
    + '<button class="btn btn-outline btn-sm" id="g-collapse"><span class="msym" style="font-size:16px">unfold_less</span>Thu hết</button>'
    + '<select class="pg-size-sel" id="g-zoom" style="height:32px;border:1px solid var(--color-border-default);border-radius:6px;padding:0 8px;font-size:13px;font-family:inherit;color:var(--color-text-body);background:var(--color-bg-surface)">'
    + '<option value="week">Phóng: Tuần</option>'
    + '<option value="month" selected>Phóng: Tháng</option>'
    + '<option value="quarter">Phóng: Quý</option></select>'
    + '</div>')
  + D.card('Danh sách milestone', milestoneTable())
  + D.footer();

D.wire();
D.headerActions();

PMSGantt.mount(document.getElementById('gantt'), P, 'month');
document.getElementById('g-zoom').addEventListener('change', (e) => PMSGantt.setZoom(e.target.value));
document.getElementById('g-expand').addEventListener('click', () => PMSGantt.expandAll());
document.getElementById('g-collapse').addEventListener('click', () => PMSGantt.collapseAll());
PMSTip.bindTruncated(document.getElementById('ms-wrap'));
</script>
