<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết dự án · Thông tin chung — PMS Platform</title>
<link rel="stylesheet" href="assets/pms-tokens.css">
<link rel="stylesheet" href="assets/pms-ias.css">
<script src="assets/pms-icons.js"></script>
</head>
<body>
<div id="pms-page"></div>

<script src="assets/pms-util.js"></script>
<script src="assets/pms-ui.js"></script>
<script src="assets/mock-data.js"></script>
<script src="assets/pms-detail.js"></script>
<script src="assets/pms-shell.js"></script>
<script>
const E = MBUtil.esc;
const D = PMSDetail;
const P = PRJ;

function subTable(cols, rows, minW) {
  return '<div class="table-wrap"><div class="table-inner"><table'
    + (minW ? ' style="min-width:' + minW + '"' : '') + '>'
    + '<thead><tr>' + cols.map(c => '<th' + (c.w ? ' style="width:' + c.w + '"' : '') + '>'
      + E(c.label) + '</th>').join('') + '</tr></thead><tbody>'
    + (rows.length ? rows.join('')
      : '<tr><td colspan="' + cols.length + '"><span class="t-muted">Chưa có dữ liệu</span></td></tr>')
    + '</tbody></table></div></div>';
}

/* ───────────────────── OKR: target vs actual (Progress) ────────────────── */
const okrRows = P.okr.map(o => '<tr>'
  + '<td class="td-truncate">' + E(o.obj) + '</td>'
  + '<td class="td-truncate">' + E(o.kr) + '</td>'
  + '<td class="td-truncate">' + (o.result ? E(o.result) : '<span class="t-muted">Chưa đo</span>') + '</td>'
  + '<td style="min-width:170px">' + MBUtil.progress(o.pct, o.pct >= 80 ? 'ok' : (o.pct >= 50 ? 'warn' : 'bad')) + '</td>'
  + '</tr>');

const memberRows = P.members.map(m => '<tr>'
  + '<td>' + MBUtil.tag(m.role) + '</td>'
  + '<td>' + E(m.dept) + '</td>'
  + '<td class="td-num">' + m.fte + '</td></tr>');
const totalFte = MBUtil.sum(P.members, m => m.fte);
memberRows.push('<tr class="total-row"><td>Tổng</td><td></td><td class="td-num">' + totalFte + '</td></tr>');

/* ──────────────────────────────── render trang ─────────────────────────── */
document.getElementById('pms-page').innerHTML =
  D.switcher('overview')
  + D.summaryCard()

  + D.card('Thông tin chung',
    '<div class="field-grid">'
    + D.field('Loại dự án', P.type)
    + D.field('Hình thức', P.form)
    + D.field('Mức độ ưu tiên', P.priority)
    + D.field('Mã dự án', P.code)
    + D.field('Tên dự án', P.name)
    + D.field('Lãnh đạo phụ trách dự án', P.leader)
    + D.field('Domain', P.domain)
    + D.field('Ngày bắt đầu', MBUtil.fmtDate(P.startDate))
    + D.field('Ngày kết thúc', MBUtil.fmtDate(P.endDate))
    + D.field('Bối cảnh / Hiện trạng', P.context, 'full')
    + D.field('Mục tiêu triển khai', P.objective, 'full')
    + D.field('Phạm vi triển khai', P.scopeText, 'full')
    + '</div>',
    '<label class="toggle"><input type="checkbox" id="share-off"' + (P.shareDisabled ? ' checked' : '') + '>'
    + '<span class="toggle-track"></span>'
    + '<span class="toggle-label">Không chia sẻ thông tin dự án</span></label>')

  + D.card('Đăng ký OKR và kết quả thực tế',
    subTable([
      { label: 'Mục tiêu (Object)' },
      { label: 'Kết quả dự kiến (Key Result)' },
      { label: 'Kết quả thực tế (Result)' },
      { label: 'Mức đạt', w: '190px' }
    ], okrRows, '900px'))

  + D.card('Nhân sự phụ trách dự án',
    '<div class="field-grid">'
    + D.field('Giám đốc dự án (Project Director)', P.people.pd)
    + D.field('Giám đốc kỹ thuật (Technical Director)', P.people.td)
    + D.field('Quản lý dự án (Project Manager)', P.people.pm)
    + '</div>')

  + D.card('Thành viên dự án',
    subTable([
      { label: 'Vai trò (Role)', w: '180px' },
      { label: 'Phòng ban (Department)' },
      { label: 'Số lượng nhân sự (FTE)', w: '200px' }
    ], memberRows, '700px'),
    '<span class="tag">' + totalFte + ' FTE</span>')

  + D.card('Liên kết hệ thống ngoài',
    '<div class="field-grid">'
    + D.field('Jira Project Key', P.external.jiraKey || '— chưa ánh xạ')
    + D.field('OPMS Demand', P.external.opmsDemand || '— chưa ánh xạ')
    + D.field('Theo dõi TTM', P.external.ttmEnabled ? 'Đã bật' : 'Chưa bật')
    + '</div>'
    + '<div class="alert alert-info mt-16"><span class="msym">link</span>'
    + '<div>Theo mô hình định danh trong PMS-HLAD, <b>ProjectId</b> của PMS là UUID bất biến; '
    + 'Jira key và OPMS demand chỉ là <i>external binding</i> có hiệu lực theo thời gian, '
    + 'không dùng làm khóa chính.</div></div>',
    '', true)

  + D.footer();

D.wire();
D.headerActions();

document.getElementById('share-off').addEventListener('change', (e) => {
  PMSNotify.info(e.target.checked ? 'Đã tắt chia sẻ thông tin dự án' : 'Đã bật chia sẻ thông tin dự án',
    e.target.checked ? 'Chỉ tổ dự án và lãnh đạo phụ trách xem được chi tiết.'
                     : 'Các đơn vị liên quan xem được thông tin chung.');
});
document.querySelectorAll('.table-inner').forEach(t => PMSTip.bindTruncated(t));
</script>
