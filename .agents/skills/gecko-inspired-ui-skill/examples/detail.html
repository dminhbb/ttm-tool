<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Detail</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="app-content">
    <div class="ui-page">
      <header class="ui-page-header">
        <div>
          <div class="ui-status ui-status-success">Active</div>
          <h1 class="ui-page-title u-mt-2">TTM Risk Monitoring</h1>
          <div class="ui-text-sm u-mt-2">Operational monitoring and delivery-risk controls.</div>
        </div>
        <div class="ui-page-header__actions">
          <button class="ui-button ui-button-secondary">More</button>
          <button class="ui-button ui-button-primary">Edit project</button>
        </div>
      </header>

      <div class="ui-grid ui-grid-12">
        <section class="ui-card col-8">
          <div class="ui-card-header">
            <h2 class="ui-card-title">Summary</h2>
          </div>
          <div class="ui-card-body">
            <p class="ui-text">Project summary, objectives, risks and notes can appear here.</p>
          </div>
        </section>

        <aside class="ui-card col-4">
          <div class="ui-card-header">
            <h2 class="ui-card-title">Metadata</h2>
          </div>
          <div class="ui-card-body ui-section">
            <div>
              <div class="ui-muted">Owner</div>
              <div class="ui-text">Minh</div>
            </div>
            <div>
              <div class="ui-muted">Target date</div>
              <div class="ui-text">30 Sep 2026</div>
            </div>
            <div>
              <div class="ui-muted">Risk</div>
              <div class="ui-status ui-status-warning">Medium</div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
